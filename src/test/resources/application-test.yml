spring:
  datasource:
    url: jdbc:h2:mem:miniautorizador;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    consumer:
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.vr.miniautorizador.*"

app:
  seguranca:
    usuario: user
    senha: password
  cartao:
    saldo-inicial: 500.00
  kafka:
    topico-solicitacao-autorizacao: mini-autorizador.autorizacao.solicitacoes.test
    grupo-consumidor: mini-autorizador-autorizador-test
    timeout-resposta-ms: 8000
