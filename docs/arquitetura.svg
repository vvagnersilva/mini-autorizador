<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1000" height="780" fill="#ffffff"/>

  <!-- Atores externos -->
  <g font-size="13" fill="#334155" text-anchor="middle">
    <line x1="135" y1="92" x2="215" y2="245" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="40" y="40" width="190" height="52" rx="26" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="135" y="62" font-weight="600">Cliente HTTP</text>
    <text x="135" y="80" font-size="11" fill="#64748b">maquininha / Postman</text>

    <line x1="865" y1="92" x2="785" y2="245" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="770" y="40" width="190" height="52" rx="26" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="865" y="62" font-weight="600">Apache Kafka</text>
    <text x="865" y="80" font-size="11" fill="#64748b">tópico de autorizações</text>

    <line x1="865" y1="688" x2="785" y2="535" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="770" y="688" width="190" height="52" rx="26" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="865" y="710" font-weight="600">MySQL 5.7</text>
    <text x="865" y="728" font-size="11" fill="#64748b">tabela cartao</text>
  </g>

  <!-- Camadas concêntricas -->
  <circle cx="500" cy="390" r="320" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="500" cy="390" r="205" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <circle cx="500" cy="390" r="110" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>

  <!-- infrastructure -->
  <g text-anchor="middle" fill="#1e3a8a">
    <text x="500" y="112" font-size="17" font-weight="700" letter-spacing="1">INFRASTRUCTURE</text>
    <text x="500" y="131" font-size="12" fill="#1d4ed8">adapters</text>

    <text x="290" y="168" font-size="14" font-weight="700">web</text>
    <text x="290" y="185" font-size="11.5" fill="#334155">Controllers · DTOs</text>
    <text x="290" y="200" font-size="11.5" fill="#334155">GlobalExceptionHandler</text>

    <text x="710" y="168" font-size="14" font-weight="700">kafka</text>
    <text x="710" y="185" font-size="11.5" fill="#334155">Producer · Listener</text>
    <text x="710" y="200" font-size="11.5" fill="#334155">Mensagens · Tópicos</text>

    <text x="313" y="566" font-size="14" font-weight="700">security</text>
    <text x="313" y="583" font-size="11.5" fill="#334155">Basic Auth</text>
    <text x="313" y="598" font-size="11.5" fill="#334155">Adapter BCrypt</text>

    <text x="687" y="566" font-size="14" font-weight="700">persistence</text>
    <text x="687" y="583" font-size="11.5" fill="#334155">Entidade JPA</text>
    <text x="687" y="598" font-size="11.5" fill="#334155">Repositório · Adapter</text>
  </g>

  <!-- application -->
  <g text-anchor="middle" fill="#065f46">
    <text x="500" y="218" font-size="16" font-weight="700" letter-spacing="1">APPLICATION</text>
    <text x="500" y="236" font-size="12" fill="#047857">casos de uso</text>

    <text x="392" y="280" font-size="13" font-weight="700">port.in</text>
    <text x="392" y="296" font-size="11" fill="#334155">interfaces</text>

    <text x="608" y="280" font-size="13" font-weight="700">service</text>
    <text x="608" y="296" font-size="11" fill="#334155">implementações</text>

    <text x="392" y="492" font-size="13" font-weight="700">config</text>
    <text x="392" y="508" font-size="11" fill="#334155">composição das regras</text>

    <text x="608" y="492" font-size="13" font-weight="700">dto</text>
    <text x="608" y="508" font-size="11" fill="#334155">comandos</text>
  </g>

  <!-- domain -->
  <g text-anchor="middle" fill="#78350f">
    <text x="500" y="332" font-size="16" font-weight="700" letter-spacing="1">DOMAIN</text>
    <text x="500" y="349" font-size="12" fill="#b45309">núcleo</text>
    <text x="500" y="376" font-size="12.5"><tspan font-weight="700">model</tspan> · Cartao</text>
    <text x="500" y="396" font-size="12.5"><tspan font-weight="700">regra</tspan> · Strategy</text>
    <text x="500" y="416" font-size="12.5"><tspan font-weight="700">port</tspan> · saída</text>
    <text x="500" y="436" font-size="12.5"><tspan font-weight="700">exception</tspan></text>
  </g>

  <!-- Regra de dependência: de fora para dentro -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <line x1="808" y1="390" x2="712" y2="390" marker-end="url(#seta)"/>
    <line x1="698" y1="390" x2="617" y2="390" marker-end="url(#seta)"/>
    <line x1="192" y1="390" x2="288" y2="390" marker-end="url(#seta)"/>
    <line x1="302" y1="390" x2="383" y2="390" marker-end="url(#seta)"/>
  </g>

  <!-- Legenda -->
  <g font-size="12.5" fill="#334155">
    <line x1="40" y1="716" x2="80" y2="716" stroke="#475569" stroke-width="2" marker-end="url(#seta)"/>
    <text x="90" y="720">dependências apontam sempre para dentro</text>
    <text x="40" y="742" fill="#64748b" font-size="11.5">o domínio não conhece Spring, JPA nem Kafka</text>
  </g>
</svg>
